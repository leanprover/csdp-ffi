name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install BLAS / LAPACK
        run: |
          sudo apt-get update
          # `zstd` is required by our toolchain-install fallback.
          sudo apt-get install -y liblapack-dev libblas-dev gfortran zstd

      # Install elan and the toolchain pinned in lean-toolchain. We retry
      # via elan first, then fall back to a direct GitHub-release download
      # because the canonical release server is intermittently unreachable.
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -e
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          ./scripts/install-toolchain.sh

      - name: Build
        run: lake build CSDP csdp-example

      - name: Run example
        run: |
          set +e
          lake exe csdp-example > /tmp/csdp.out 2>&1
          rc=$?
          tail -20 /tmp/csdp.out
          exit $rc

      - name: Test downstream package without native link flags
        run: ./scripts/test-downstream.sh

      - name: Test downstream editor loading
        run: python3 ./scripts/test-lsp.py

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install zstd (for toolchain fallback)
        run: brew install zstd

      # The lakefile hard-codes the Command Line Tools SDK path so that the
      # build works without any IO at lake configuration time. macOS runners
      # ship with Xcode but not always with CLT at /Library/Developer/...,
      # so we ensure that path exists by symlinking the active SDK there.
      - name: Ensure CLT SDK symlink
        run: |
          sdk_path="$(xcrun --show-sdk-path)"
          target="/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
          echo "active sdk: $sdk_path"
          if [ ! -d "$target" ]; then
            sudo mkdir -p "$(dirname "$target")"
            sudo ln -sfn "$sdk_path" "$target"
          fi
          ls -ld "$target"

      # Install elan and the toolchain pinned in lean-toolchain. We retry
      # via elan first, then fall back to a direct GitHub-release download
      # because the canonical release server is intermittently unreachable.
      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          set -e
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          ./scripts/install-toolchain.sh

      - name: Build
        run: lake build CSDP csdp-example

      - name: Run example
        run: |
          set +e
          lake exe csdp-example > /tmp/csdp.out 2>&1
          rc=$?
          tail -20 /tmp/csdp.out
          exit $rc

      - name: Test downstream package without native link flags
        run: ./scripts/test-downstream.sh

  windows:
    name: Windows (MSYS2 / mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            git
            curl
            unzip

      # On Windows the GITHUB_PATH/GITHUB_ENV files written from the MSYS2
      # shell are not always honoured for subsequent steps, so we install
      # elan, build, and run the example all in one shell session that
      # sets up PATH locally.
      - name: Install elan, build, and run example
        run: |
          set -e
          # Stage the MSYS2 BLAS / Fortran runtime libraries into a known
          # project-local path. The lakefile points `-L` at this path on
          # Windows so it works regardless of where setup-msys2 unpacks
          # (default `C:\msys64`, GitHub runners' `RUNNER_TEMP\msys64`,
          # etc.). `MINGW_PREFIX` is set by the MSYS2 shell.
          mkdir -p vendor/mingw-libs
          for pat in 'libopenblas*' 'libgfortran*' 'libquadmath*' 'libgcc*' 'libwinpthread*' 'libstdc++*'; do
            cp "$MINGW_PREFIX/lib"/$pat vendor/mingw-libs/ 2>/dev/null || true
          done
          ls vendor/mingw-libs/

          curl -sSf -L https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip -o elan-init.zip
          unzip -q elan-init.zip
          MSYS2_ARG_CONV_EXCL="*" ./elan-init.exe -y --default-toolchain none --no-modify-path
          ELAN_DIR_MSYS="$(cygpath -u "$USERPROFILE")/.elan"
          ls -la "$ELAN_DIR_MSYS/bin" || (echo "elan install did not produce expected files" && exit 1)
          export ELAN_HOME="$ELAN_DIR_MSYS"
          export PATH="$ELAN_DIR_MSYS/bin:$MINGW_PREFIX/bin:$PATH"
          ./scripts/install-toolchain.sh
          lake build CSDP csdp-example
          set +e
          lake exe csdp-example > /tmp/csdp.out 2>&1
          rc=$?
          tail -20 /tmp/csdp.out
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          ./scripts/test-downstream.sh
